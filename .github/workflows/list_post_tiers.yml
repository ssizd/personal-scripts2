name: List Recent Post Tiers (manual helper)

on:
  workflow_dispatch:

jobs:
  list-post-tiers:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install requests

    - name: List recent post tiers
      env:
        PATREON_ACCESS_TOKEN: ${{ secrets.PATREON_ACCESS_TOKEN }}
        PATREON_CAMPAIGN_ID: ${{ secrets.PATREON_CAMPAIGN_ID }}
      run: python -u list_recent_post_tiers.py
